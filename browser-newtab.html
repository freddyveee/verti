<!doctype html>
<meta charset="utf-8">
<title>Neuer Tab</title>
<style>
  html,body{margin:0;height:100%;background:#20222a;color:#e8e8ee;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
  .logo{width:104px;height:104px;filter:drop-shadow(0 10px 28px rgba(124,58,237,0.5))}
  .t{font-size:22px;font-weight:700;letter-spacing:.2px}
  form{width:min(560px,80vw)}
  .search{display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;background:#2a2d37;
    border:1px solid #3d404b;border-radius:26px;box-shadow:0 6px 22px rgba(0,0,0,0.28)}
  .search:focus-within{border-color:#7c3aed;box-shadow:0 6px 22px rgba(0,0,0,0.28),0 0 0 3px rgba(124,58,237,0.35)}
  .search svg{flex:0 0 auto;color:#8b90a0}
  input{flex:1;border:none;outline:none;background:transparent;color:#f0f0f4;font-size:16px}
  input::placeholder{color:#7b8090}
</style>
<body>
  <img class="logo" src="icons/verti-browser.svg" alt="">
  <div class="t">Verti Browser</div>
  <form id="f" autocomplete="off">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11 L14.5 14.5"/></svg>
      <input id="q" type="text" placeholder="Im Web suchen oder Adresse eingeben" spellcheck="false" autofocus>
    </div>
  </form>
  <script>
    function toUrl(t){
      t=t.trim(); if(!t) return null;
      if(/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) return t;
      if(/^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/|$)/i.test(t)) return 'http://'+t;
      if(/^[^\s]+\.[^\s]{2,}([\/?#]|$)/.test(t) && !t.includes(' ')) return 'https://'+t;
      return 'https://www.google.com/search?q='+encodeURIComponent(t);
    }
    document.getElementById('f').addEventListener('submit',function(e){
      e.preventDefault(); const u=toUrl(document.getElementById('q').value); if(u) location.href=u;
    });
  </script>
</body>
