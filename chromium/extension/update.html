<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  /* Erzwungenes Update: dunkler Vollbild-Schleier, deckt die Apps dahinter ab
     und fängt Klicks ab (das Fenster ist dann fensterfüllend, s. main.js) */
  body.forced { background: rgba(10, 8, 18, 0.90); }
  body.forced .card { -webkit-app-region: no-drag; }
  .card {
    position: relative;
    width: 400px;
    max-height: 540px;
    border-radius: 22px;
    background: linear-gradient(160deg, #8b5cf6 0%, #7c3aed 45%, #5b21b6 100%);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    color: #fff;
    padding: 30px 28px 26px;
    display: flex; flex-direction: column;
    overflow: hidden;
    -webkit-app-region: drag;
  }
  button, details, .notes { -webkit-app-region: no-drag; }

  .emoji {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 16px;
  }
  h1 { font-size: 21px; font-weight: 700; text-align: center; }
  .sub { font-size: 14px; text-align: center; opacity: 0.88; margin-top: 6px; line-height: 1.5; }

  details {
    margin-top: 18px;
    background: rgba(0, 0, 0, 0.18);
    border-radius: 14px;
    overflow: hidden;
  }
  summary {
    list-style: none; cursor: pointer;
    padding: 12px 16px;
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: space-between;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: '▸'; opacity: 0.7; transition: transform 0.15s; }
  details[open] summary::after { transform: rotate(90deg); }
  .notes {
    padding: 0 16px 12px;
    font-size: 13.5px; line-height: 1.55; opacity: 0.95;
    max-height: 180px; overflow-y: auto;
  }
  .notes ul { list-style: none; }
  .notes li { padding-left: 18px; position: relative; margin-bottom: 6px; }
  .notes li::before { content: '•'; position: absolute; left: 4px; }
  .notes p { margin-bottom: 6px; }

  .buttons { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn {
    border: none; border-radius: 12px; cursor: pointer;
    padding: 13px; font-size: 15px; font-weight: 700;
    font-family: inherit; transition: transform 0.1s, background 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #fff; color: #5b21b6; }
  .btn-primary:hover { background: #f3ecff; }
  .btn-ghost { background: rgba(255, 255, 255, 0.14); color: #fff; font-weight: 600; }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.22); }

  .footnote { margin-top: 14px; font-size: 12px; text-align: center; opacity: 0.65; }

  .progress-track {
    margin-top: 22px; height: 10px; border-radius: 5px;
    background: rgba(0, 0, 0, 0.25); overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 5px;
    background: linear-gradient(90deg, #fbbf24, #f9fafb);
    transition: width 0.25s;
  }
  .percent { margin-top: 10px; text-align: center; font-size: 14px; font-weight: 600; opacity: 0.9; }

  #confetti {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1;
  }
  #content { position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="card">
    <canvas id="confetti"></canvas>
    <div id="content"></div>
  </div>

<script src="update-shim.js"></script>
  <script src="update.js"></script>
</body>
</html>
