<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
  .card {
    width: 100%; height: 100%;
    background: #1f2129; color: #fff;
    border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    -webkit-app-region: drag;
  }
  header { padding: 16px 20px 8px; }
  header h1 { font-size: 15px; font-weight: 700; }
  header p { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 3px; }
  .tabs { display: flex; gap: 6px; padding: 8px 20px 0; -webkit-app-region: no-drag; }
  .tab { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.55); padding: 6px 12px; border-radius: 8px 8px 0 0; cursor: pointer; }
  .tab.active { color: #fff; background: rgba(255,255,255,0.07); }
  .list { flex: 1; overflow-y: auto; padding: 12px 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; -webkit-app-region: no-drag; align-content: start; }
  .src { background: rgba(255,255,255,0.05); border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; transition: border-color 0.12s, background 0.12s; }
  .src:hover { background: rgba(255,255,255,0.09); }
  .src.sel { border-color: #9257ff; background: rgba(146,87,255,0.14); }
  .src .thumb { width: 100%; height: 92px; object-fit: cover; border-radius: 6px; background: #000; display: block; }
  .src .name { font-size: 11.5px; margin-top: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255,255,255,0.85); }
  footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px 16px; -webkit-app-region: no-drag; }
  button { border: none; border-radius: 9px; padding: 9px 18px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .cancel { background: rgba(255,255,255,0.1); color: #fff; }
  .cancel:hover { background: rgba(255,255,255,0.17); }
  .share { background: #9257ff; color: #fff; }
  .share:hover { background: #a06fff; }
  .share:disabled { opacity: 0.4; cursor: default; }
  .empty { grid-column: 1 / -1; text-align: center; color: rgba(255,255,255,0.4); font-size: 12px; padding: 30px; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Bildschirm teilen</h1>
      <p>Wähle aus, was die App sehen darf.</p>
    </header>
    <div class="tabs">
      <div class="tab active" data-kind="screen">Bildschirme</div>
      <div class="tab" data-kind="window">Fenster</div>
    </div>
    <div class="list" id="list"></div>
    <footer>
      <button class="cancel" id="cancel">Abbrechen</button>
      <button class="share" id="share" disabled>Teilen</button>
    </footer>
  </div>
<script>
  var sources = [];
  var kind = 'screen';
  var selected = null;
  var listEl = document.getElementById('list');
  var shareBtn = document.getElementById('share');

  function render() {
    var items = sources.filter(function (s) { return s.kind === kind; });
    listEl.innerHTML = '';
    if (!items.length) {
      var e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nichts gefunden.'; listEl.appendChild(e);
      return;
    }
    items.forEach(function (s) {
      var d = document.createElement('div');
      d.className = 'src' + (selected === s.id ? ' sel' : '');
      var img = document.createElement('img'); img.className = 'thumb'; img.src = s.thumb; d.appendChild(img);
      var n = document.createElement('div'); n.className = 'name'; n.textContent = s.name; d.appendChild(n);
      d.addEventListener('click', function () { selected = s.id; shareBtn.disabled = false; render(); });
      d.addEventListener('dblclick', function () { confirm(); });
      listEl.appendChild(d);
    });
  }
  function confirm() { if (selected) window.vertiPicker.choose(selected); }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      t.classList.add('active');
      kind = t.dataset.kind;
      selected = null; shareBtn.disabled = true;
      render();
    });
  });
  document.getElementById('cancel').addEventListener('click', function () { window.vertiPicker.choose(null); });
  shareBtn.addEventListener('click', confirm);
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.vertiPicker.choose(null); });

  window.vertiPicker.onSources(function (list) { sources = list; render(); });
</script>
</body>
</html>
