<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw;
    height: 100vh;
    background: #22242c;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .drag-region {
    position: fixed;
    top: 0; left: 0;
    height: 44px;
    width: 100vw;
    -webkit-app-region: drag;
    z-index: 10;
  }
  /* Verti-Schriftzug mittig in der Fensterleiste, wie auf der Landingpage */
  .brandmark {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 44px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15.5px; font-weight: 700; color: #fff;
    letter-spacing: 0.2px;
    z-index: 10;
    pointer-events: none;
  }
  .brandmark em { font-style: normal; color: #b78aff; }
  /* Rotes Etikett nur in der Dev-Version (npx electron .), sonst verwechselt
     man sie mit der installierten App */
  .dev-tag {
    display: none;
    margin-left: 8px;
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #fff;
    background: #e5484d;
    vertical-align: 2px;
    pointer-events: auto; /* Tooltip mit Versionsnummer, obwohl die Marke selbst Klicks durchlässt */
  }
  .dev-tag.show { display: inline-block; }
  /* Lila Update-Hinweis oben rechts, wenn während des Betriebs ein Update kommt */
  .update-pill {
    position: fixed;
    top: 8px; right: 14px;
    z-index: 12;
    -webkit-app-region: no-drag;
    display: none;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #8b5cf6, #6b2fe0);
    color: #fff;
    font-size: 11.5px;
    font-weight: 600;
    font-family: inherit;
    padding: 6px 13px;
    border-radius: 999px;
    animation: pillPulse 2.6s ease-in-out infinite;
  }
  .update-pill.show { display: block; }
  .update-pill:hover { background: linear-gradient(135deg, #9d73f8, #7c3aed); }
  @keyframes pillPulse {
    0%, 100% { box-shadow: 0 3px 12px rgba(131, 71, 255, 0.35); }
    50% { box-shadow: 0 3px 20px rgba(131, 71, 255, 0.8); }
  }
  /* Windows: Platz für Minimieren/Maximieren/Schließen rechts */
  body.win .update-pill { right: 150px; }
  .nav {
    position: fixed;
    top: 7px;
    left: 84px;
    display: flex;
    gap: 4px;
    z-index: 11;
    -webkit-app-region: no-drag;
  }
  .nav button {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: rgba(255, 255, 255, 0.75);
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .nav button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
  .nav button:disabled { color: rgba(255, 255, 255, 0.22); cursor: default; background: transparent; }
  .nav button svg { pointer-events: none; }
  /* Windows: keine Ampel-Buttons links, Navigation rückt an den Rand */
  body.win .nav { left: 12px; }
  .sidebar {
    position: fixed;
    top: 44px; left: 0; bottom: 0;
    width: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding-bottom: 14px;
  }
  .app-btn {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: background 0.15s, transform 0.18s ease;
    touch-action: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  /* Sortieren per Ziehen: das gezogene Icon hebt sich ab und folgt dem Zeiger
     ohne Verzögerung, die anderen rutschen animiert (transform-Transition) */
  .app-btn.dragging {
    transition: background 0.15s, box-shadow 0.15s;
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
    z-index: 5;
    cursor: grabbing;
  }
  #apps.no-anim .app-btn { transition: none !important; }
  .app-btn:hover { background: rgba(255, 255, 255, 0.08); }
  .app-btn.active { background: rgba(255, 255, 255, 0.14); }
  .app-btn.active::before {
    content: '';
    position: absolute;
    left: -11px;
    top: 12px;
    width: 3px;
    height: 22px;
    border-radius: 2px;
    background: #9257ff;
    box-shadow: 0 0 8px rgba(146, 87, 255, 0.7);
  }
  .app-btn img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    pointer-events: none;
  }
  .badge {
    position: absolute;
    top: 1px;
    right: 1px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 9px;
    background: #ef4444;
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    box-shadow: 0 0 0 2px #22242c;
  }
  .fallback {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: #3a3f4b;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .plus-btn {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    border: 1.5px dashed rgba(255, 255, 255, 0.3);
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
    font-size: 22px;
    font-weight: 300;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .plus-btn:hover {
    border-color: rgba(255, 255, 255, 0.6);
    color: #fff;
    background: rgba(255, 255, 255, 0.06);
  }

  /* App-Bibliothek */
  .library {
    position: fixed;
    inset: 0;
    background: #22242c;
    z-index: 5;
    display: none;
    flex-direction: column;
    padding: 60px 40px 30px;
    overflow-y: auto;
  }
  .library.open { display: flex; }
  .library h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .library p.sub {
    color: rgba(255, 255, 255, 0.5);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .close-btn {
    position: absolute;
    top: 54px;
    right: 40px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  .close-btn:hover { background: rgba(255, 255, 255, 0.16); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    margin-bottom: 30px;
  }
  .card {
    /* Icon und voller Name oben, Knopf in ganzer Breite darunter —
       damit lange App-Namen nicht abgeschnitten werden */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 12px;
    padding: 14px 12px 12px;
    text-align: center;
  }
  .card img, .card .fallback { width: 30px; height: 30px; }
  .card .info { width: 100%; }
  .card .name {
    color: #fff;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.3;
    overflow-wrap: break-word;
  }
  .card button {
    border: none;
    border-radius: 7px;
    width: 100%;
    padding: 7px 11px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }
  .card button.add { background: #4a6fd4; color: #fff; }
  .card button.add:hover { background: #5a7fe4; }
  .card button.remove { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.7); }
  .card button.remove:hover { background: rgba(220, 80, 80, 0.35); color: #fff; }
  .custom {
    display: flex;
    gap: 10px;
    max-width: 560px;
  }
  .custom input {
    flex: 1;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 9px;
    padding: 10px 14px;
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .custom input:focus { border-color: #4a6fd4; }
  .custom button {
    background: #4a6fd4;
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .custom button:hover { background: #5a7fe4; }
  h2 {
    color: rgba(255, 255, 255, 0.75);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="drag-region"></div>
  <div class="brandmark">Verti<em>.</em><span class="dev-tag" id="devTag">Dev-Version</span></div>
  <button class="update-pill" id="updatePill" title="Neue Version bereit – klicken für Details">Update verfügbar</button>
  <div class="nav">
    <button id="navBack" title="Zurück (Cmd+[)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2 L4 7 L9 12"/></svg>
    </button>
    <button id="navForward" title="Vorwärts (Cmd+])">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2 L10 7 L5 12"/></svg>
    </button>
    <button id="navHome" title="Zur Startseite der App (Cmd+Shift+H)">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7 L7.5 2 L13 7 M3.5 6.5 V12.5 H6 V9 H9 V12.5 H11.5 V6.5"/></svg>
    </button>
  </div>
  <div class="sidebar">
    <div id="apps" style="display: contents;"></div>
    <button class="plus-btn" id="plus" title="App-Bibliothek">+</button>
  </div>

  <div class="library" id="library">
    <button class="close-btn" id="closeLib" title="Schließen">✕</button>
    <h1>App-Bibliothek</h1>
    <p class="sub">Apps hinzufügen oder entfernen. Alles wird automatisch gespeichert.</p>
    <div id="catalog"></div>
    <h2>Eigene App per URL</h2>
    <div class="custom">
      <input id="customUrl" type="text" placeholder="https://beispiel.de" spellcheck="false">
      <button id="customAdd">Hinzufügen</button>
    </div>
  </div>

  <script>
    (async () => {
      let apps = await window.verti.getApps();
      const catalog = await window.verti.getCatalog();
      let badgeCounts = await window.verti.getBadges();
      const appInfo = await window.verti.getAppInfo();
      if (!appInfo.packaged) {
        const devTag = document.getElementById('devTag');
        devTag.title = `Dev-Version ${appInfo.version} aus ~/Projekte/verti`;
        devTag.classList.add('show');
      }
      const appsEl = document.getElementById('apps');
      const catalogEl = document.getElementById('catalog');
      const library = document.getElementById('library');
      let activeId = null;

      // Icon-Kette: eigenes Icon → Favicon der Subdomain → Favicon der Hauptdomain → Buchstabe.
      // Googles Favicon-Dienst liefert bei unbekannten Subdomains einen 16px-Globus,
      // erkennbar an der geringen Auflösung — dann weiter zur nächsten Quelle.
      function iconFor(app) {
        const hostname = new URL(app.url).hostname;
        const apex = hostname.split('.').slice(-2).join('.');
        const sources = [];
        // Cache-Buster: lokale Icons sonst nach Updates veraltet aus dem Bildcache
        if (app.icon) sources.push(app.icon + (app.icon.includes('?') ? '&v=' : '?v=') + Date.now());
        sources.push('https://www.google.com/s2/favicons?domain=' + hostname + '&sz=64');
        if (apex !== hostname) {
          sources.push('https://www.google.com/s2/favicons?domain=' + apex + '&sz=64');
        }

        const img = document.createElement('img');
        let i = 0;
        const isGeneric = () => img.src.includes('s2/favicons') && img.naturalWidth < 32;
        const next = () => {
          i++;
          if (i < sources.length) {
            img.src = sources[i];
          } else {
            const fb = document.createElement('div');
            fb.className = 'fallback';
            fb.textContent = app.name[0].toUpperCase();
            img.replaceWith(fb);
          }
        };
        img.onload = () => { if (isGeneric()) next(); };
        img.onerror = next;
        img.src = sources[0];
        return img;
      }

      // Sortieren per Ziehen, wie auf dem iPhone: Das gezogene Icon folgt dem
      // Zeiger, die anderen rutschen live in ihre neue Position (Transition auf
      // transform), beim Loslassen gleitet das Icon in die Lücke und erst dann
      // wird die Reihenfolge übernommen. Erst ab 5 px Bewegung wird gezogen,
      // ein normaler Klick bleibt ein Klick. Während des Ziehens wird die
      // Sidebar nicht neu aufgebaut (Badge-Updates warten bis zum Loslassen).
      let drag = null; // { btn, from, to, pitch, startY, pointerId, moved }
      let pendingRender = false;
      let suppressClick = false;
      const listItems = () => [...appsEl.querySelectorAll('.app-btn')];
      function dragShift(items, from, to) {
        items.forEach((el, j) => {
          if (el === drag.btn) return;
          let shift = 0;
          if (from < to && j > from && j <= to) shift = -drag.pitch;
          else if (from > to && j >= to && j < from) shift = drag.pitch;
          el.style.transform = shift ? `translateY(${shift}px)` : '';
        });
      }
      function onDragMove(e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const dy = e.clientY - drag.startY;
        if (!drag.moved) {
          if (Math.abs(dy) < 5) return;
          drag.moved = true;
          drag.btn.classList.add('dragging');
        }
        const items = listItems();
        drag.to = Math.max(0, Math.min(items.length - 1, drag.from + Math.round(dy / drag.pitch)));
        drag.btn.style.transform = `translateY(${dy}px) scale(1.08)`;
        dragShift(items, drag.from, drag.to);
      }
      function onDragEnd(e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const d = drag;
        drag = null;
        window.removeEventListener('pointermove', onDragMove);
        window.removeEventListener('pointerup', onDragEnd);
        window.removeEventListener('pointercancel', onDragEnd);
        if (!d.moved) return; // war nur ein Klick
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 0); // der Klick kommt direkt nach pointerup
        d.btn.classList.remove('dragging');
        d.btn.style.transform = `translateY(${(d.to - d.from) * d.pitch}px)`; // in die Lücke gleiten
        setTimeout(() => {
          // Positionen sind erreicht: Transforms ohne Animation zurücksetzen
          // und das DOM in dieselbe Reihenfolge bringen → kein sichtbarer Sprung
          appsEl.classList.add('no-anim');
          for (const el of listItems()) el.style.transform = '';
          const others = listItems().filter((el) => el !== d.btn);
          appsEl.insertBefore(d.btn, others[d.to] || null);
          void appsEl.offsetHeight;
          appsEl.classList.remove('no-anim');
          const ids = listItems().map((b) => b.dataset.id);
          if (ids.join() !== apps.map((a) => a.id).join()) window.verti.reorderApps(ids);
          if (pendingRender) { pendingRender = false; renderSidebar(); }
        }, 200);
      }

      function renderSidebar() {
        if (drag && drag.moved) { pendingRender = true; return; }
        appsEl.innerHTML = '';
        for (const app of apps) {
          const btn = document.createElement('button');
          btn.className = 'app-btn' + (app.id === activeId ? ' active' : '');
          btn.title = app.name;
          btn.dataset.id = app.id;
          btn.appendChild(iconFor(app));
          const count = badgeCounts[app.id] || 0;
          if (count > 0) {
            const badge = document.createElement('span');
            badge.className = 'badge';
            badge.textContent = count > 99 ? '99+' : String(count);
            btn.appendChild(badge);
          }
          btn.addEventListener('click', () => {
            if (suppressClick) return; // Loslassen nach dem Ziehen ist kein Klick
            window.verti.switchApp(app.id);
          });
          btn.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            window.verti.showAppMenu(app.id);
          });
          btn.addEventListener('pointerdown', (e) => {
            if (e.button !== 0 || drag) return;
            const items = listItems();
            if (items.length < 2) return;
            const pitch = items[1].getBoundingClientRect().top - items[0].getBoundingClientRect().top || 56;
            const from = items.indexOf(btn);
            drag = { btn, from, to: from, pitch, startY: e.clientY, pointerId: e.pointerId, moved: false };
            try { btn.setPointerCapture(e.pointerId); } catch {}
            window.addEventListener('pointermove', onDragMove);
            window.addEventListener('pointerup', onDragEnd);
            window.addEventListener('pointercancel', onDragEnd);
          });
          appsEl.appendChild(btn);
        }
      }

      function makeCard(item, installedIds) {
        const card = document.createElement('div');
        card.className = 'card';
        card.appendChild(iconFor(item));
        const info = document.createElement('div');
        info.className = 'info';
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = item.name;
        info.appendChild(name);
        card.appendChild(info);
        const btn = document.createElement('button');
        if (installedIds.has(item.id)) {
          btn.className = 'remove';
          btn.textContent = 'Entfernen';
          btn.addEventListener('click', () => window.verti.removeApp(item.id));
        } else {
          btn.className = 'add';
          btn.textContent = 'Hinzufügen';
          btn.addEventListener('click', () => window.verti.addApp(item));
        }
        card.appendChild(btn);
        return card;
      }

      function renderCatalog() {
        catalogEl.innerHTML = '';
        const installedIds = new Set(apps.map((a) => a.id));
        const extras = apps.filter((a) => !catalog.some((c) => c.id === a.id));
        const sections = [
          ['IMPERIO Apps', catalog.filter((c) => c.imperio)],
          ['Weitere Apps', [...catalog.filter((c) => !c.imperio), ...extras]],
        ];
        for (const [title, items] of sections) {
          if (!items.length) continue;
          const h = document.createElement('h2');
          h.textContent = title;
          catalogEl.appendChild(h);
          const grid = document.createElement('div');
          grid.className = 'grid';
          for (const item of items) grid.appendChild(makeCard(item, installedIds));
          catalogEl.appendChild(grid);
        }
      }

      function openLibrary() {
        renderCatalog();
        library.classList.add('open');
        applyNavState();
        window.verti.openLibrary();
      }
      function closeLibrary(notify) {
        library.classList.remove('open');
        applyNavState();
        if (notify) window.verti.closeLibrary();
      }

      const isMac = window.verti.platform === 'darwin';
      const mod = isMac ? 'Cmd' : 'Strg';
      if (!isMac) document.body.classList.add('win');
      const navBack = document.getElementById('navBack');
      const navForward = document.getElementById('navForward');
      const navHomeBtn = document.getElementById('navHome');
      navBack.title = `Zurück (${mod}+[)`;
      navForward.title = `Vorwärts (${mod}+])`;
      navHomeBtn.title = `Zur Startseite der App (${mod}+Shift+H)`;
      // In der offenen Bibliothek heißen „Zurück" und „Startseite": Bibliothek
      // schließen, zurück zur App (man drückt intuitiv den Pfeil, nicht das ✕).
      // Der Pfeil bleibt dort klickbar, auch wenn die App keinen Verlauf hat;
      // Vorwärts gibt es in der Bibliothek nicht.
      let navState = { canGoBack: false, canGoForward: false };
      function applyNavState() {
        const inLibrary = library.classList.contains('open');
        navBack.disabled = inLibrary ? false : !navState.canGoBack;
        navForward.disabled = inLibrary ? true : !navState.canGoForward;
      }
      navBack.addEventListener('click', () => {
        if (library.classList.contains('open')) closeLibrary(true);
        else window.verti.navBack();
      });
      navForward.addEventListener('click', () => window.verti.navForward());
      navHomeBtn.addEventListener('click', () => {
        if (library.classList.contains('open')) closeLibrary(true);
        else window.verti.navHome();
      });
      window.verti.onNavState((s) => {
        navState = s;
        applyNavState();
      });

      document.getElementById('plus').addEventListener('click', openLibrary);
      document.getElementById('closeLib').addEventListener('click', () => closeLibrary(true));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && library.classList.contains('open')) closeLibrary(true);
      });

      const customUrl = document.getElementById('customUrl');
      function addCustom() {
        let value = customUrl.value.trim();
        if (!value) return;
        if (!/^https?:\/\//i.test(value)) value = 'https://' + value;
        try {
          const url = new URL(value);
          const id = 'custom-' + url.hostname.replace(/\W/g, '-');
          const name = url.hostname.replace(/^www\./, '');
          window.verti.addApp({ id, name, url: url.href });
          customUrl.value = '';
        } catch {}
      }
      document.getElementById('customAdd').addEventListener('click', addCustom);
      customUrl.addEventListener('keydown', (e) => { if (e.key === 'Enter') addCustom(); });

      window.verti.onActiveApp((id) => {
        activeId = id;
        closeLibrary(false);
        renderSidebar();
      });
      // Das erste 'active-app' kann vor der Registrierung oben gekommen sein
      // (Wettlauf beim Laden) → aktuellen Stand einmal abholen
      const currentActive = await window.verti.getActiveApp();
      if (currentActive && !activeId) {
        activeId = currentActive;
        renderSidebar();
      }

      window.verti.onAppsChanged((newApps) => {
        apps = newApps;
        renderSidebar();
        if (library.classList.contains('open')) renderCatalog();
      });

      // Windows hat kein Dock-Badge: Gesamtzahl als rotes Overlay
      // aufs Taskleisten-Icon malen und an den Hauptprozess schicken
      function updateOverlay() {
        if (isMac) return;
        const total = Object.values(badgeCounts).reduce((a, b) => a + b, 0);
        if (!total) {
          window.verti.setOverlay(null, 0);
          return;
        }
        const c = document.createElement('canvas');
        c.width = 32;
        c.height = 32;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(16, 16, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold ' + (total > 99 ? 14 : 18) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(total > 99 ? '99+' : String(total), 16, 17);
        window.verti.setOverlay(c.toDataURL(), total);
      }

      window.verti.onBadges((b) => {
        badgeCounts = b;
        renderSidebar();
        updateOverlay();
      });

      const updatePill = document.getElementById('updatePill');
      updatePill.addEventListener('click', () => window.verti.openUpdatePopup());
      window.verti.onUpdatePill(() => updatePill.classList.add('show'));
      if (await window.verti.getPendingUpdate()) updatePill.classList.add('show');

      renderSidebar();
      updateOverlay();
    })();
  </script>
</body>
</html>
