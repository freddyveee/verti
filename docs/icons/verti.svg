<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8347ff"/>
      <stop offset="0.5" stop-color="#6b2fe0"/>
      <stop offset="1" stop-color="#38206e"/>
    </linearGradient>
    <linearGradient id="wg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9257ff" stop-opacity="0.8"/>
      <stop offset="0.45" stop-color="#6b3ad1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38206e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b07bff" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#7a48d9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38206e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f1eaff"/>
      <stop offset="1" stop-color="#d5c2ff"/>
    </linearGradient>
    <filter id="vshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#22094f" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rr"><rect x="64" y="64" width="896" height="896" rx="200"/></clipPath>
  </defs>
  <g clip-path="url(#rr)">
    <rect x="64" y="64" width="896" height="896" fill="url(#bg)"/>
    <!-- weicher Lichtschein oben wie auf der Landingpage -->
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>
    <!-- Welle der Landingpage, unten einlaufend -->
    <g transform="translate(0,540) scale(0.7315,0.78)">
      <path d="M0,300 C220,160 430,420 700,290 C970,160 1150,400 1400,230 L1400,620 L0,620 Z" fill="url(#wg1)"/>
      <path d="M0,300 C220,160 430,420 700,290 C970,160 1150,400 1400,230" fill="none" stroke="#c9a6ff" stroke-opacity="0.9" stroke-width="7"/>
      <path d="M0,390 C260,250 500,470 780,350 C1060,230 1200,440 1400,330 L1400,620 L0,620 Z" fill="url(#wg2)"/>
      <path d="M0,390 C260,250 500,470 780,350 C1060,230 1200,440 1400,330" fill="none" stroke="#dcc5ff" stroke-opacity="0.5" stroke-width="5"/>
    </g>
    <!-- plastisches V: Schattenwurf, Tiefenkante, Verlaufskörper, Lichtkante -->
    <g filter="url(#vshadow)">
      <path d="M336 326 L512 688 L688 326" fill="none" stroke="#8f68e0" stroke-width="148" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,12)"/>
      <path d="M336 326 L512 688 L688 326" fill="none" stroke="url(#vg)" stroke-width="148" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M336 322 L512 684 L688 322" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-40)"/>
    </g>
  </g>
</svg>
