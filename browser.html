<!doctype html>
<meta charset="utf-8">
<title>Verti Browser</title>
<style>
  :root {
    --bg:#25272f; --bg2:#1e202a; --bar:#31343e; --field:#1e202a; --tabstrip:#1e202a;
    --line:#383b46; --line2:#3d404b; --hover-tab:#2c2f39; --bm-hover:#343742;
    --suggest-bg:#282b34; --suggest-sel:#353944;
    --text:#e8e8ee; --text-strong:#ffffff; --text-2:#b9bcc7; --icon:#cfd2dc; --icon-2:#c9ccd6;
    --icon-dim:#8a8f9c; --placeholder:#7b8090; --text-dim:#7f8496; --nav-disabled:#565a66;
    --accent:#7c3aed; --nav-hover:rgba(255,255,255,0.1); --xhover:rgba(255,255,255,0.15);
  }
  :root[data-theme="light"] {
    --bg:#f0efe9; --bg2:#eae8e2; --bar:#f7f6f2; --field:#ffffff; --tabstrip:#e8e6df;
    --line:rgba(0,0,0,0.12); --line2:rgba(0,0,0,0.16); --hover-tab:#dcdad3; --bm-hover:#dcdad3;
    --suggest-bg:#ffffff; --suggest-sel:#eceae4;
    --text:#26262b; --text-strong:#141418; --text-2:rgba(0,0,0,0.62); --icon:rgba(0,0,0,0.6); --icon-2:rgba(0,0,0,0.5);
    --icon-dim:rgba(0,0,0,0.45); --placeholder:rgba(0,0,0,0.4); --text-dim:rgba(0,0,0,0.45); --nav-disabled:rgba(0,0,0,0.25);
    --accent:#7c3aed; --nav-hover:rgba(0,0,0,0.07); --xhover:rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  /* ---- Tab-Leiste ---- */
  #tabs { display: flex; align-items: flex-end; gap: 4px; height: 42px; padding: 7px 8px 0; background: var(--tabstrip); overflow: hidden; }
  .tab { display: flex; align-items: center; gap: 8px; min-width: 66px; max-width: 242px; height: 35px;
    padding: 0 9px 0 11px; border-radius: 10px 10px 0 0; background: transparent; color: var(--text-2); cursor: default;
    font-size: 14px; position: relative; flex: 0 1 220px; }
  .tab:hover { background: var(--hover-tab); }
  .tab.active { background: var(--bar); color: var(--text-strong); }
  .tab img { width: 17px; height: 17px; border-radius: 3px; flex: 0 0 auto; }
  .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: 0 0 auto; width: 19px; height: 19px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
    opacity: 0; font-size: 16px; line-height: 1; color: var(--icon-2); }
  .tab:hover .x, .tab.active .x { opacity: 1; }
  .tab .x:hover { background: var(--xhover); color: var(--text-strong); }
  #newtab { flex: 0 0 auto; width: 33px; height: 33px; border: none; background: transparent; color: var(--text-2);
    font-size: 22px; border-radius: 9px; cursor: default; }
  #newtab:hover { background: var(--hover-tab); color: var(--text-strong); }
  /* ---- Werkzeugleiste ---- */
  #bar { display: flex; align-items: center; gap: 5px; height: 51px; padding: 0 11px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .nav { width: 35px; height: 35px; border: none; background: transparent; color: var(--icon); border-radius: 9px;
    display: flex; align-items: center; justify-content: center; cursor: default; flex: 0 0 auto; }
  .nav:hover:not(:disabled) { background: var(--nav-hover); color: var(--text-strong); }
  .nav:disabled { color: var(--nav-disabled); }
  .nav svg { pointer-events: none; }
  #addrwrap { flex: 1; display: flex; align-items: center; gap: 9px; height: 37px; margin: 0 7px;
    background: var(--field); border: 1px solid var(--line2); border-radius: 20px; padding: 0 15px; }
  #addrwrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,58,237,0.35); }
  #lock { flex: 0 0 auto; color: var(--icon-dim); display: flex; }
  #addr { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-size: 15px; }
  #addr::placeholder { color: var(--placeholder); }
  #progress { position: fixed; left: 0; bottom: 0; height: 2.5px; width: 0; background: linear-gradient(90deg,#9257ff,#7c3aed); opacity: 0; border-radius: 2px; }
  body.loading #progress { opacity: 1; animation: prog 1.1s ease-in-out infinite; }
  @keyframes prog { 0% { left: 0; width: 6%; } 50% { width: 55%; } 100% { left: 100%; width: 8%; } }
  #star { flex: 0 0 auto; }
  #star svg { pointer-events: none; }
  #star.on { color: #f7c948; }
  #bookmarks { display: none; align-items: center; gap: 2px; height: 37px; padding: 0 7px; background: var(--bg); border-bottom: 1px solid var(--line); overflow: hidden; }
  body.hasbm #bookmarks { display: flex; }
  .bm { display: flex; align-items: center; gap: 7px; max-width: 209px; height: 27px; padding: 0 5px 0 10px; border-radius: 7px; color: var(--text-2); font-size: 13.5px; cursor: default; flex: 0 0 auto; }
  .bm:hover { background: var(--bm-hover); color: var(--text-strong); }
  .bm img { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }
  .bm .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .bm .x { width: 15px; height: 15px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: 0; color: var(--icon-2); }
  .bm:hover .x { opacity: 1; }
  .bm .x:hover { background: var(--xhover); color: var(--text-strong); }
  #suggest { position: fixed; left: 8px; right: 8px; top: 93px; max-height: 300px; overflow-y: auto;
    background: var(--suggest-bg); border: 1px solid var(--line2); border-top: none; border-radius: 0 0 14px 14px;
    box-shadow: 0 16px 34px rgba(0,0,0,0.45); display: none; z-index: 60; }
  body.suggesting #suggest { display: block; }
  .sg { display: flex; align-items: center; gap: 11px; padding: 9px 15px; font-size: 14px; color: var(--text); cursor: default; }
  .sg:hover, .sg.sel { background: var(--suggest-sel); }
  .sg .ic { flex: 0 0 auto; width: 16px; height: 16px; color: var(--icon-dim); display: flex; }
  .sg .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sg .u { margin-left: auto; color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; padding-left: 12px; }
</style>
<body>
  <div id="tabs"></div>
  <div id="bar">
    <button class="nav" id="back" title="Zurück" disabled><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 L5 8 L10 13"/></svg></button>
    <button class="nav" id="fwd" title="Vorwärts" disabled><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 L11 8 L6 13"/></svg></button>
    <button class="nav" id="reload" title="Neu laden"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8 a5 5 0 1 1 -1.5 -3.6"/><path d="M13 3 V5 H11"/></svg></button>
    <div id="addrwrap">
      <span id="lock"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4 7V5a4 4 0 0 1 8 0v2h1v7H3V7h1zm2 0h4V5a2 2 0 0 0-4 0v2z"/></svg></span>
      <input id="addr" type="text" placeholder="Adresse eingeben oder im Web suchen" spellcheck="false" autocomplete="off">
    </div>
    <button class="nav" id="star" title="Zu Lesezeichen hinzufügen"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
  </div>
  <div id="bookmarks"></div>
  <div id="suggest"></div>
  <div id="progress"></div>
  <script>
    const tabsEl = document.getElementById('tabs');
    const addr = document.getElementById('addr');
    const back = document.getElementById('back');
    const star = document.getElementById('star');
    const fwd = document.getElementById('fwd');
    let editing = false;

    function renderTabs(tabs) {
      tabsEl.innerHTML = '';
      for (const t of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (t.active ? ' active' : '');
        el.title = t.title || '';
        if (t.favicon) {
          const im = document.createElement('img');
          im.src = t.favicon; im.onerror = () => im.remove();
          el.appendChild(im);
        }
        const tt = document.createElement('span');
        tt.className = 't';
        tt.textContent = t.title || 'Neuer Tab';
        el.appendChild(tt);
        const x = document.createElement('span');
        x.className = 'x'; x.textContent = '×';
        x.addEventListener('click', (e) => { e.stopPropagation(); window.vertibrowser.closeTab(t.key); });
        el.appendChild(x);
        el.addEventListener('click', () => window.vertibrowser.switchTab(t.key));
        tabsEl.appendChild(el);
      }
      const plus = document.createElement('button');
      plus.id = 'newtab'; plus.textContent = '+'; plus.title = 'Neuer Tab';
      plus.addEventListener('click', () => window.vertibrowser.newTab());
      tabsEl.appendChild(plus);
    }

    function applyState(s) {
      back.disabled = !s.canGoBack;
      fwd.disabled = !s.canGoForward;
      document.body.classList.toggle('loading', !!s.loading);
      star.classList.toggle('on', !!s.bookmarked);
      star.title = s.bookmarked ? 'Lesezeichen entfernen' : 'Zu Lesezeichen hinzufügen';
      if (!editing) addr.value = displayUrl(s.url);
    }
    function displayUrl(u) {
      if (!u || u === 'about:blank') return '';
      if (u.startsWith('file://')) return ''; // Neuer-Tab-Seite: leer lassen
      return u;
    }

    window.vertibrowser.onTabs(renderTabs);
    window.vertibrowser.onState(applyState);
    window.vertibrowser.onTheme((t) => {
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
    });
    window.vertibrowser.onBookmarks((list) => {
      document.body.classList.toggle('hasbm', list.length > 0);
      const bar = document.getElementById('bookmarks');
      bar.innerHTML = '';
      for (const b of list) {
        const el = document.createElement('div'); el.className = 'bm'; el.title = b.title || b.url;
        if (b.favicon) { const im = document.createElement('img'); im.src = b.favicon; im.onerror = () => im.remove(); el.appendChild(im); }
        const t = document.createElement('span'); t.className = 't'; t.textContent = b.title || b.url; el.appendChild(t);
        const x = document.createElement('span'); x.className = 'x'; x.textContent = '×';
        x.addEventListener('click', (e) => { e.stopPropagation(); window.vertibrowser.removeBookmark(b.url); });
        el.appendChild(x);
        el.addEventListener('click', () => window.vertibrowser.openBookmark(b.url));
        bar.appendChild(el);
      }
    });
    window.vertibrowser.onFocusAddress(() => { addr.focus(); addr.select(); });

    back.addEventListener('click', () => window.vertibrowser.back());
    fwd.addEventListener('click', () => window.vertibrowser.forward());
    document.getElementById('reload').addEventListener('click', () => window.vertibrowser.reload());
    star.addEventListener('click', () => window.vertibrowser.toggleBookmark());
    // ---- Vorschläge (Verlauf + Google-Autocomplete) ----
    const suggestBox = document.getElementById('suggest');
    let sgItems = [], sgSel = -1, sgTimer = null, sgTyped = '';
    function sgIcon(kind) {
      return kind === 'history'
        ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
        : '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="M11 11 L14.5 14.5"/></svg>';
    }
    function markSel() { [...suggestBox.children].forEach((el, i) => el.classList.toggle('sel', i === sgSel)); }
    function closeSuggest() {
      if (document.body.classList.contains('suggesting')) { document.body.classList.remove('suggesting'); window.vertibrowser.suggestClose(); }
      suggestBox.innerHTML = ''; sgItems = []; sgSel = -1;
    }
    function renderSuggest(items) {
      suggestBox.innerHTML = '';
      if (!items.length || document.activeElement !== addr) { closeSuggest(); return; }
      items.forEach((it, i) => {
        const el = document.createElement('div'); el.className = 'sg';
        el.innerHTML = '<span class="ic">' + sgIcon(it.kind) + '</span><span class="lb"></span>' + (it.sub ? '<span class="u"></span>' : '');
        el.querySelector('.lb').textContent = it.label;
        if (it.sub) el.querySelector('.u').textContent = it.sub;
        el.addEventListener('mouseenter', () => { sgSel = i; markSel(); });
        el.addEventListener('mousedown', (e) => { e.preventDefault(); choose(i); });
        suggestBox.appendChild(el);
      });
      document.body.classList.add('suggesting');
      window.vertibrowser.suggestOpen();
    }
    function choose(i) { const it = sgItems[i] || { value: addr.value }; window.vertibrowser.navigate(it.value); addr.blur(); closeSuggest(); }
    window.vertibrowser.onSuggestions(({ text, items }) => {
      if (text !== addr.value.trim()) return; // veralteter Treffer
      sgItems = items; sgSel = -1; renderSuggest(items);
    });
    addr.addEventListener('input', () => {
      editing = true; clearTimeout(sgTimer);
      const v = addr.value; sgTyped = v;
      if (!v.trim()) { closeSuggest(); return; }
      sgTimer = setTimeout(() => window.vertibrowser.suggest(v), 110);
    });
    addr.addEventListener('focus', () => { editing = true; setTimeout(() => addr.select(), 0); });
    addr.addEventListener('blur', () => { editing = false; setTimeout(closeSuggest, 150); });
    addr.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown' && sgItems.length) {
        e.preventDefault(); sgSel = (sgSel + 1) % sgItems.length; markSel();
        addr.value = sgItems[sgSel].kind === 'search' ? sgItems[sgSel].label : sgItems[sgSel].value;
      } else if (e.key === 'ArrowUp' && sgItems.length) {
        e.preventDefault(); sgSel = (sgSel <= 0 ? sgItems.length : sgSel) - 1; markSel();
        addr.value = sgItems[sgSel].kind === 'search' ? sgItems[sgSel].label : sgItems[sgSel].value;
      } else if (e.key === 'Enter') {
        editing = false;
        if (sgSel >= 0 && sgItems[sgSel]) choose(sgSel);
        else { window.vertibrowser.navigate(addr.value); addr.blur(); closeSuggest(); }
      } else if (e.key === 'Escape') {
        if (document.body.classList.contains('suggesting')) { e.preventDefault(); addr.value = sgTyped; closeSuggest(); }
        else { editing = false; addr.blur(); }
      }
    });

    window.vertibrowser.ready();
  </script>
</body>
