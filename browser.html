<!doctype html>
<meta charset="utf-8">
<title>Verti Browser</title>
<style>
  :root { --bg:#20222a; --bar:#2a2d37; --line:#383b46;  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #20222a; color: #e8e8ee;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  /* ---- Tab-Leiste ---- */
  #tabs { display: flex; align-items: flex-end; gap: 4px; height: 38px; padding: 6px 8px 0; background: #191b22; overflow: hidden; }
  .tab { display: flex; align-items: center; gap: 7px; min-width: 60px; max-width: 220px; height: 32px;
    padding: 0 8px 0 10px; border-radius: 9px 9px 0 0; background: transparent; color: #b9bcc7; cursor: default;
    font-size: 13px; position: relative; flex: 0 1 200px; }
  .tab:hover { background: #262932; }
  .tab.active { background: #2a2d37; color: #fff; }
  .tab img { width: 15px; height: 15px; border-radius: 3px; flex: 0 0 auto; }
  .tab .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { flex: 0 0 auto; width: 17px; height: 17px; border-radius: 5px; display: flex; align-items: center; justify-content: center;
    opacity: 0; font-size: 15px; line-height: 1; color: #c9ccd6; }
  .tab:hover .x, .tab.active .x { opacity: 1; }
  .tab .x:hover { background: rgba(255,255,255,0.15); color: #fff; }
  #newtab { flex: 0 0 auto; width: 30px; height: 30px; border: none; background: transparent; color: #b9bcc7;
    font-size: 20px; border-radius: 8px; cursor: default; }
  #newtab:hover { background: #262932; color: #fff; }
  /* ---- Werkzeugleiste ---- */
  #bar { display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 10px; background: #2a2d37; border-bottom: 1px solid #383b46; }
  .nav { width: 32px; height: 32px; border: none; background: transparent; color: #cfd2dc; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; cursor: default; flex: 0 0 auto; }
  .nav:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #fff; }
  .nav:disabled { color: #565a66; }
  .nav svg { pointer-events: none; }
  #addrwrap { flex: 1; display: flex; align-items: center; gap: 8px; height: 34px; margin: 0 6px;
    background: #191b22; border: 1px solid #3d404b; border-radius: 18px; padding: 0 14px; }
  #addrwrap:focus-within { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.35); }
  #lock { flex: 0 0 auto; color: #8a8f9c; display: flex; }
  #addr { flex: 1; border: none; outline: none; background: transparent; color: #f0f0f4; font-size: 13.5px; }
  #addr::placeholder { color: #7b8090; }
  #progress { position: fixed; left: 0; bottom: 0; height: 2.5px; width: 0; background: linear-gradient(90deg,#9257ff,#7c3aed); opacity: 0; border-radius: 2px; }
  body.loading #progress { opacity: 1; animation: prog 1.1s ease-in-out infinite; }
  @keyframes prog { 0% { left: 0; width: 6%; } 50% { width: 55%; } 100% { left: 100%; width: 8%; } }
  #star { flex: 0 0 auto; }
  #star svg { pointer-events: none; }
  #star.on { color: #f7c948; }
  #bookmarks { display: none; align-items: center; gap: 2px; height: 34px; padding: 0 6px; background: #20222a; border-bottom: 1px solid #383b46; overflow: hidden; }
  body.hasbm #bookmarks { display: flex; }
  .bm { display: flex; align-items: center; gap: 6px; max-width: 190px; height: 25px; padding: 0 4px 0 9px; border-radius: 7px; color: #c6c9d3; font-size: 12.5px; cursor: default; flex: 0 0 auto; }
  .bm:hover { background: #2d3038; color: #fff; }
  .bm img { width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto; }
  .bm .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .bm .x { width: 15px; height: 15px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; opacity: 0; color: #c9ccd6; }
  .bm:hover .x { opacity: 1; }
  .bm .x:hover { background: rgba(255,255,255,0.15); color: #fff; }
</style>
<body>
  <div id="tabs"></div>
  <div id="bar">
    <button class="nav" id="back" title="Zurück" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 L5 8 L10 13"/></svg></button>
    <button class="nav" id="fwd" title="Vorwärts" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3 L11 8 L6 13"/></svg></button>
    <button class="nav" id="reload" title="Neu laden"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8 a5 5 0 1 1 -1.5 -3.6"/><path d="M13 3 V5 H11"/></svg></button>
    <div id="addrwrap">
      <span id="lock"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4 7V5a4 4 0 0 1 8 0v2h1v7H3V7h1zm2 0h4V5a2 2 0 0 0-4 0v2z"/></svg></span>
      <input id="addr" type="text" placeholder="Adresse eingeben oder im Web suchen" spellcheck="false" autocomplete="off">
    </div>
    <button class="nav" id="star" title="Zu Lesezeichen hinzufügen"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg></button>
  </div>
  <div id="bookmarks"></div>
  <div id="progress"></div>
  <script>
    const tabsEl = document.getElementById('tabs');
    const addr = document.getElementById('addr');
    const back = document.getElementById('back');
    const star = document.getElementById('star');
    const fwd = document.getElementById('fwd');
    let editing = false;

    function renderTabs(tabs) {
      tabsEl.innerHTML = '';
      for (const t of tabs) {
        const el = document.createElement('div');
        el.className = 'tab' + (t.active ? ' active' : '');
        el.title = t.title || '';
        if (t.favicon) {
          const im = document.createElement('img');
          im.src = t.favicon; im.onerror = () => im.remove();
          el.appendChild(im);
        }
        const tt = document.createElement('span');
        tt.className = 't';
        tt.textContent = t.title || 'Neuer Tab';
        el.appendChild(tt);
        const x = document.createElement('span');
        x.className = 'x'; x.textContent = '×';
        x.addEventListener('click', (e) => { e.stopPropagation(); window.vertibrowser.closeTab(t.key); });
        el.appendChild(x);
        el.addEventListener('click', () => window.vertibrowser.switchTab(t.key));
        tabsEl.appendChild(el);
      }
      const plus = document.createElement('button');
      plus.id = 'newtab'; plus.textContent = '+'; plus.title = 'Neuer Tab';
      plus.addEventListener('click', () => window.vertibrowser.newTab());
      tabsEl.appendChild(plus);
    }

    function applyState(s) {
      back.disabled = !s.canGoBack;
      fwd.disabled = !s.canGoForward;
      document.body.classList.toggle('loading', !!s.loading);
      star.classList.toggle('on', !!s.bookmarked);
      star.title = s.bookmarked ? 'Lesezeichen entfernen' : 'Zu Lesezeichen hinzufügen';
      if (!editing) addr.value = displayUrl(s.url);
    }
    function displayUrl(u) {
      if (!u || u === 'about:blank') return '';
      if (u.startsWith('file://')) return ''; // Neuer-Tab-Seite: leer lassen
      return u;
    }

    window.vertibrowser.onTabs(renderTabs);
    window.vertibrowser.onState(applyState);
    window.vertibrowser.onBookmarks((list) => {
      document.body.classList.toggle('hasbm', list.length > 0);
      const bar = document.getElementById('bookmarks');
      bar.innerHTML = '';
      for (const b of list) {
        const el = document.createElement('div'); el.className = 'bm'; el.title = b.title || b.url;
        if (b.favicon) { const im = document.createElement('img'); im.src = b.favicon; im.onerror = () => im.remove(); el.appendChild(im); }
        const t = document.createElement('span'); t.className = 't'; t.textContent = b.title || b.url; el.appendChild(t);
        const x = document.createElement('span'); x.className = 'x'; x.textContent = '×';
        x.addEventListener('click', (e) => { e.stopPropagation(); window.vertibrowser.removeBookmark(b.url); });
        el.appendChild(x);
        el.addEventListener('click', () => window.vertibrowser.openBookmark(b.url));
        bar.appendChild(el);
      }
    });
    window.vertibrowser.onFocusAddress(() => { addr.focus(); addr.select(); });

    back.addEventListener('click', () => window.vertibrowser.back());
    fwd.addEventListener('click', () => window.vertibrowser.forward());
    document.getElementById('reload').addEventListener('click', () => window.vertibrowser.reload());
    star.addEventListener('click', () => window.vertibrowser.toggleBookmark());
    addr.addEventListener('focus', () => { editing = true; setTimeout(() => addr.select(), 0); });
    addr.addEventListener('blur', () => { editing = false; });
    addr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { editing = false; window.vertibrowser.navigate(addr.value); addr.blur(); }
      else if (e.key === 'Escape') { editing = false; addr.blur(); }
    });

    window.vertibrowser.ready();
  </script>
</body>
