<!doctype html>
<meta charset="utf-8">
<title>Verti</title>
<!--
  Vertis Sidebar als Chromium-Erweiterung. Aussehen und Farbwelten sind 1:1
  aus sidebar.html uebernommen; statt window.verti (Electron) laufen die
  Aktionen ueber chrome.tabs und chrome.storage.
-->
<style>
  :root {
    --bg:#2a2c36; --panel:#2f313c; --text:#fff; --text-2:rgba(255,255,255,.6);
    --hover:rgba(255,255,255,.08); --active:rgba(255,255,255,.14);
    --divider:rgba(255,255,255,.12); --accent:#9257ff;
  }
  :root[data-farbe="marine"]{--bg:#232a3a;--panel:#283041}
  :root[data-farbe="wald"]{--bg:#232f2a;--panel:#283630}
  :root[data-farbe="kupfer"]{--bg:#322a26;--panel:#3a302b}
  :root[data-farbe="pflaume"]{--bg:#2c2635;--panel:#332c3d}
  :root[data-farbe="rubin"]{--bg:#33262a;--panel:#3b2c31}
  :root[data-theme="light"]{--bg:#efece6;--panel:#f7f5f0;--text:#26262b;
    --text-2:rgba(0,0,0,.55);--hover:rgba(0,0,0,.06);--active:rgba(0,0,0,.10);
    --divider:rgba(0,0,0,.14);--accent:#7c3aed}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-user-select:none;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .kopf{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
  .marke{font-size:16px;font-weight:800}.marke em{font-style:normal;color:#b78aff}
  .kopf button{background:transparent;border:0;color:var(--text-2);cursor:pointer;font-size:15px;padding:4px 7px;border-radius:7px}
  .kopf button:hover{background:var(--hover);color:var(--text)}
  .liste{flex:1;overflow-y:auto;padding:4px 8px 12px}
  .app{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;position:relative}
  .app:hover{background:var(--hover)}
  .app.an{background:var(--active)}
  .app.an::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:2px;background:var(--accent)}
  .app img{width:22px;height:22px;border-radius:6px;flex:0 0 auto;background:#fff}
  .app .ers{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;background:var(--hover);font-size:11px;font-weight:800}
  .app span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zahl{background:#ff3b30;color:#fff;font-size:11px;font-weight:800;border-radius:9px;
    min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .titel{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
    color:var(--text-2);padding:12px 10px 5px}
  .fuss{border-top:1px solid var(--divider);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .farbe{width:22px;height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0}
  .farbe.on{border-color:var(--accent)}
  .suche{margin:0 8px 6px;width:calc(100% - 16px);background:var(--panel);border:1px solid var(--divider);
    color:var(--text);border-radius:9px;padding:7px 10px;font:inherit;font-size:13px}
  .suche::placeholder{color:var(--text-2)}
</style>
<div class="kopf">
  <div class="marke">Verti<em>.</em></div>
  <button id="modus" title="Hell/Dunkel">◐</button>
</div>
<input class="suche" id="suche" placeholder="App suchen …" spellcheck="false">
<div class="liste" id="liste"></div>
<div class="fuss" id="farben"></div>
<script src="sidebar.js"></script>
